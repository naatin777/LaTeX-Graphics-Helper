name: Release VSCode Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: GitHub Release (VSIX + Full Changelog compare link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          tag="v$(node -p "require('./package.json').version")"
          prev=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ -n "$prev" ]]; then
            notes="**Full Changelog**: https://github.com/$repo/compare/$prev...$tag"
          else
            notes="**Full Changelog**: https://github.com/$repo/commits/$tag"
          fi
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" *.vsix --repo "$repo" --clobber
          else
            gh release create "$tag" *.vsix --repo "$repo" --title "$tag" --notes "$notes"
          fi

      - name: Publish to Visual Studio Marketplace (Trusted Publishing / OIDC)
        run: npx --no-install vsce publish --packagePath *.vsix --oidc

      - name: Publish to Open VSX Registry
        run: npx --no-install ovsx publish *.vsix --pat ${{ secrets.OVSX_PAT }}
