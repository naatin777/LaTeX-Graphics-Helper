name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - "next/**"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-host:
    name: Extension Host coverage (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            test_command: xvfb-run npm run test:coverage:run
          - os: macos-latest
            label: macOS
            test_command: npm run test:coverage:run
          - os: windows-latest
            label: Windows
            test_command: npm run test:coverage:run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - run: npm install -g npm@12.0.1
        shell: bash

      - run: node --version && npm --version
        shell: bash

      - run: npm ci
        shell: bash

      - name: Build extension and Webview
        run: npm run build
        shell: bash

      - if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/install-test-tools-linux.sh
        shell: bash

      - if: matrix.os == 'macos-latest'
        run: bash .github/scripts/install-image-tools-macos.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/install-image-tools-windows.ps1
        shell: pwsh

      - if: matrix.os != 'windows-latest'
        run: bash .github/scripts/verify-image-tools-unix.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/verify-image-tools-windows.ps1
        shell: pwsh

      - name: Run VS Code Extension Host tests with coverage
        run: ${{ matrix.test_command }}
        shell: bash
        env:
          LGH_VSCODE_TEST_USER_DATA_DIR: .vscode-test-ci-data

      - if: always()
        name: Upload VS Code coverage
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-host-coverage-${{ matrix.label }}
          path: coverage/vscode/
          if-no-files-found: ignore

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extension-host-test-${{ matrix.label }}
          path: .vscode-test-ci-data/
          if-no-files-found: ignore

      - if: always()
        name: Cleanup VS Code test data
        run: |
          node --input-type=module -e "import { rm } from 'node:fs/promises'; await rm('.vscode-test-ci-data', { recursive: true, force: true, maxRetries: 20, retryDelay: 200 });"
        shell: bash

  webview:
    name: Webview Vitest coverage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - run: npm install -g npm@12.0.1
        shell: bash

      - run: node --version && npm --version
        shell: bash

      - run: npm ci
        shell: bash

      - name: Run Crop PDF Webview tests with coverage
        run: npm run test:webview:crop_pdf -- --coverage
        shell: bash

      - name: Run Merge PDF Webview tests with coverage
        run: npm run test:webview:merge_pdf -- --coverage
        shell: bash

      - name: Run Split PDF Webview tests with coverage
        run: npm run test:webview:split_pdf -- --coverage
        shell: bash

      - if: always()
        name: Upload Webview Vitest coverage
        uses: actions/upload-artifact@v7
        with:
          name: webview-vitest-coverage
          path: coverage/webview/
          if-no-files-found: ignore

  coverage-report:
    name: Coverage report
    runs-on: ubuntu-latest
    needs:
      - extension-host
      - webview

    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Download Extension Host coverage reports
        uses: actions/download-artifact@v7
        with:
          pattern: vscode-extension-host-coverage-*
          path: coverage-input
          merge-multiple: false

      - name: Download Webview coverage report
        uses: actions/download-artifact@v7
        with:
          name: webview-vitest-coverage
          path: coverage-input/webview-vitest-coverage

      - name: Generate coverage report
        run: node .github/scripts/render-coverage-report.mjs --input coverage-input --output coverage-report.md
        env:
          COVERAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Add coverage to job summary
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        name: Update pull request coverage comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('coverage-report.md', 'utf8');
            const marker = '<!-- latex-graphics-helper-coverage-report -->';
            const legacyMarkers = [
              '<!-- octocov:Linux -->',
              '<!-- octocov:macOS -->',
              '<!-- octocov:Windows -->',
            ];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            for (const comment of comments) {
              if (legacyMarkers.some((legacyMarker) => comment.body?.includes(legacyMarker))) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
              }
            }

            const existing = comments.filter((comment) => comment.body?.includes(marker));
            if (existing.length === 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } else {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing[0].id, body });
              for (const duplicate of existing.slice(1)) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: duplicate.id });
              }
            }
